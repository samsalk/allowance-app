name: Supabase Keep-Alive

# Supabase free-tier projects pause after about a week without activity. The
# weekly allowance job alone runs right at that limit, so this makes a cheap
# read twice a week (max gap 4 days) to keep the project awake.

on:
  schedule:
    # Mondays and Thursdays at 12:00 UTC.
    - cron: '0 12 * * 1,4'
  workflow_dispatch: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "$SUPABASE_URL/rest/v1/family_data?select=id&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"
          echo
          echo "Supabase responded OK."
